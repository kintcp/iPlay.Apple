  release:
    # needs: test
    if: github.ref == 'refs/heads/prod'
    runs-on: macos-26
    # TestFlight processing and notarization can each take a while.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_VERSION: "1.0.0"
    steps:
      - name: 🛠️ Checkout Code
        uses: actions/checkout@v7
        with:
          repository: saltpi/iPlay.Apple
          ref: 'develop'
          token: ${{ secrets.REPO_TOKEN }}
          submodules: recursive

      - name: ⚙️ Run XcodeGen
        id: setup
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen
          # write AuthKey.p8 for App Store Connect API Key authentication
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > .meta/config/AuthKey.p8
          # write AuthKey.p8 absolute path for xcodebuild to use
          echo "auth-key-path=$PWD/.meta/config/AuthKey.p8" >> "$GITHUB_OUTPUT"
          echo "AUTH_KEY_PATH=$PWD/.meta/config/AuthKey.p8" >> "$GITHUB_ENV"

      - name: 🔨 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: 🔑 Import Code Signing Certificates
        # One .p12 with Apple Distribution, Mac Installer Distribution and
        # Developer ID Application.
        uses: saltpi/import-codesign-certs@main
        with:
          p12-zip-base64: ${{ secrets.P12_ZIP_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: 📄 Download provisioning profiles
        uses: saltpi/download-provisioning-profiles@main
        with:
          bundle-id: top.ourfor.app.iPlayClient
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📄 Download provisioning profiles
        uses: saltpi/download-provisioning-profiles@main
        with:
          bundle-id: top.ourfor.app.iPlayClient.Safari
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📦 Archive and Export for App Store
        id: build
        uses: saltpi/xcodebuild@main
        with:
          project: iPlay.xcodeproj
          scheme: iPlay.MacOS
          sdk: macosx
          action: archive
          archive-path: .build/Artifacts/iPlay.MacOS.xcarchive
          export-options-plist: .meta/config/macos/export.options.app-store.plist
          export-path: .build/Artifacts/app-store
          disable-automatic-package-resolution: false
          # run_attempt makes a re-run upload a new, higher build instead of
          # being rejected as a duplicate.
          build-number: ${{ github.run_number }}.${{ github.run_attempt }}
          authentication-key-path: ${{ steps.setup.outputs.auth-key-path }}
          authentication-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          authentication-key-issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          allow-provisioning-updates: true

      # TestFlight runs before the DMG so a notary-service outage can't block
      # it. To never upload twice instead, move this step after Notarize DMG.
      - name: 🚀 Upload TestFlight Build
        uses: saltpi/upload-testflight-build@main
        with:
          app-path: ${{ steps.build.outputs.pkg-path }}
          app-type: macos
          # The default appstore-api backend only uploads .ipa files.
          backend: altool
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false

      - name: 🔏 Export Developer ID
        id: devid
        uses: saltpi/xcodebuild@main
        with:
          scheme: iPlay.MacOS.DMG
          action: export
          archive-path: ${{ steps.build.outputs.archive-path }}
          export-options-plist: .meta/config/macos/export.options.developer-id.plist
          export-path: .build/Artifacts/developer-id

      - name: 💿 Create DMG
        id: dmg
        uses: saltpi/create-dmg@main
        with:
          app-path: ${{ steps.devid.outputs.app-path }}
          dmg-path: .build/dmg/iPlay.dmg
          team-id: SNZWBGWPDW

      - name: 🛡️ Notarize DMG
        uses: saltpi/notarize@main
        with:
          path: ${{ steps.dmg.outputs.dmg-path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: 📤 Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: iPlay-dmg
          path: ${{ steps.dmg.outputs.dmg-path }}
          if-no-files-found: error

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: iPlay ${{ env.APP_VERSION }} (${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ${{ steps.dmg.outputs.dmg-path }}
          generate_release_notes: true
          make_latest: true

      - name: 📤 Upload Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: logs-release
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: warn
