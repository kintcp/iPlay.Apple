name: build-tvos-app

run-name: Build for tvOS

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-tvos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: 🛠️ Checkout repository
        uses: actions/checkout@v7
        with:
          repository: saltpi/iPlay.Apple
          ref: 'develop'
          token: ${{ secrets.REPO_TOKEN }}
          submodules: recursive

      - name: ⚙️ Run XcodeGen
        id: setup
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen
          # write AuthKey.p8 for App Store Connect API Key authentication
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > .meta/config/AuthKey.p8
          # write AuthKey.p8 absolute path for xcodebuild to use
          echo "auth-key-path=$PWD/.meta/config/AuthKey.p8" >> "$GITHUB_OUTPUT"
          echo "AUTH_KEY_PATH=$PWD/.meta/config/AuthKey.p8" >> "$GITHUB_ENV"

      - name: 🔨 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - name: 🔑 Import code sign
        if: github.ref == 'refs/heads/prod'
        uses: saltpi/import-codesign-certs@main
        with:
          p12-zip-base64: ${{ secrets.P12_ZIP_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: 🏗️ Build
        if: github.ref != 'refs/heads/prod'
        uses: saltpi/xcodebuild@main
        with:
          project: iPlay.Apple.xcodeproj
          scheme: iPlay.TV
          sdk: appletvsimulator
          build-number: ${{ github.run_number }}
          zip-result-bundle: true

      - name: 📦 Build Signed
        if: github.ref == 'refs/heads/prod'
        uses: saltpi/xcodebuild@main
        with:
          project: iPlay.xcodeproj
          scheme: iPlay.TV
          sdk: appletvos
          action: archive
          archive-path: .build/Archives/iPlay.xcarchive
          export-options-plist: .meta/config/tvos/export.options.app-store.plist
          build-number: ${{ github.run_number }}
          disable-automatic-package-resolution: false
          zip-result-bundle: true
          zip-archive: true
          authentication-key-path: ${{ steps.setup.outputs.auth-key-path }}
          authentication-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          authentication-key-issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          allow-provisioning-updates: true

      - name: 📤 Upload Logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: logs
          include-hidden-files: true
          path: .build/*.log
          if-no-files-found: error

      - name: 🚀 Upload TestFlight Build
        if: github.ref == 'refs/heads/prod'
        uses: saltpi/upload-testflight-build@main
        env:
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          PRODUCT_BUNDLE_IDENTIFIER: "top.ourfor.app.iPlayClient"
        with:
          app-path: ".build/Artifacts/iPlay.ipa/iPlay.ipa"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false
